apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yolo-frontend
  template:
    metadata:
      labels:
        app: yolo-frontend
    spec:
      containers:
        - name: yolo-frontend
          image: myronkip/yolo-frontend:v1.0.11
          ports:
            - containerPort: 80
          env:
            - name: MONGO_URL
              value: "mongodb://mongo-0.mongo,mongo-1.mongo,mongo-2.mongo:27017"
