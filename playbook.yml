---
- name: Ansible playbook to dockerize and run yolo e-commerce app using ansible
  hosts: all
  become: true
  roles: 
    - frontend-deployment
    - setup-mongodb   
    - backend-deployment
  vars:
      ansible_user: vagrant
      ansible_distribution_release: focal
      repo_url: "https://github.com/myronkip/yolo.git"
  pre_tasks:
    - name: Update package index
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Add Docker’s official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release | lower }} stable"
        state: present

    - name: Update package index again
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker-ce
        state: present

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ensure the Docker group exists
      group:
        name: docker
        state: present
    
    - name: Download Docker Compose
      get_url:
        url : "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64"
        # url: "https://github.com/docker/compose/releases/download/2.29.7/docker-compose-$(uname -s)-$(uname -m)"
        dest: /usr/local/bin/docker-compose
        mode: 'u+x,g+x'

    - name: Ensure docker-compose is executable
      file:
        path: /usr/local/bin/docker-compose
        mode: 'u+x,g+x'

    - name: Add user to Docker group
      user:
        name: "{{ ansible_user }}"  
        groups: docker
        append: yes

    - name: Create Docker network if it does not exist
      docker_network:
        name: app_net
        state: present
    
    - name: Create a Docker volume
      community.docker.docker_volume:
        name: app_mongo_data
        state: present
    
    - name: Verify Docker installation
      command: docker ps
      register: docker_ps

    - name: Verify Docker Compose installation
      command: docker-compose --version
      register: docker_compose_version

    - debug:
        msg: "Docker Ps: {{ docker_ps.stdout }} Docker Compose version: {{ docker_compose_version.stdout }}"
    
  tasks:

  - name: Start services with Docker Compose
    command: docker-compose up -d --no-recreate
    args:
        chdir: /opt/yolo-backend
    register: compose_otput
  
  - name: Show compose output
    debug: 
      msg: " {{ compose_otput.stdout_lines}}"




    